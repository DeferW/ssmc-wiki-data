name: Build fire zones

on:
  workflow_dispatch:
    inputs:
      game_ref:
        description: "Game commit/tag/branch (use the same commit for all data builds)"
        required: true
        default: "master"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-generated-data
  cancel-in-progress: false

jobs:
  build-fire-zones:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download fire zone sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: ${{ inputs.game_ref }}
          path: game-source
          sparse-checkout: |
            Resources/Prototypes
            Resources/Locale/ru-RU
          sparse-checkout-cone-mode: false

      - name: Install catalog tools
        run: python3 -m pip install -r requirements.txt

      - name: Build fire zones
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 -m scripts.fire_zones.build \
            --game-source game-source \
            --output data/fire-zones/catalog.json \
            --commit "$GAME_COMMIT" \
            --locale ru-RU

      - name: Validate fire zones
        run: python3 -m scripts.fire_zones.validate --catalog data/fire-zones/catalog.json

      - name: Save fire zones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fire-zones/catalog.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build fire zones"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
