name: Test chemistry prototype index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7

      - name: Download custom chemistry prototypes
        uses: actions/checkout@v7
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          sparse-checkout: |
            Resources/Prototypes/_RMC14/Reagents
            Resources/Prototypes/_Stories/Reagents
            Resources/Prototypes/_RMC14/Recipes/Reactions
            Resources/Prototypes/_Stories/Recipes/Reactions
          sparse-checkout-cone-mode: false

      - name: Install YAML parser
        run: |
          python3 -m pip install "PyYAML>=6,<7"

      - name: Build prototype index
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 scripts/index_chemistry.py \
            --game-source game-source \
            --output data/chemistry-index.json \
            --commit "$GAME_COMMIT"

      - name: Validate prototype index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/chemistry-index.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          counts = data["prototypeCounts"]

          if counts["reagents"] == 0:
              raise RuntimeError("No custom reagents found")

          if counts["reactions"] == 0:
              raise RuntimeError("No custom reactions found")

          allowed_paths = (
              "/_RMC14/",
              "/_Stories/",
          )

          invalid = [
              entry["sourceFile"]
              for entry in data["entries"]
              if not any(
                  marker in entry["sourceFile"]
                  for marker in allowed_paths
              )
          ]

          if invalid:
              raise RuntimeError(
                  "Upstream files entered the index: "
                  + ", ".join(sorted(set(invalid)))
              )

          print(f'Reagents: {counts["reagents"]}')
          print(f'Reactions: {counts["reactions"]}')
          print(f'Duplicate IDs: {len(data["duplicates"])}')
          print("Only RMC14 and Stories sources found")
          PY

      - name: Save prototype index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chemistry-index.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Test custom chemistry prototype index"
            git push
          fi
