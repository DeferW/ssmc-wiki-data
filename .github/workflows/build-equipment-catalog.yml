name: Build equipment catalog

on:
  push:
    branches:
      - main
    paths:
      - "config/catalog-overrides.json"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-equipment-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Download equipment sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          sparse-checkout: |
            Resources/Prototypes
            Resources/Locale/ru-RU
            Resources/Textures
          sparse-checkout-cone-mode: false

      - name: Install catalog tools
        run: |
          python3 -m pip install -r requirements.txt

      - name: Build equipment data
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 scripts/build_equipment_catalog.py \
            --game-source game-source \
            --config config/equipment-sources.yml \
            --index-output data/equipment-index.json \
            --output data/equipment-catalog.json \
            --sprites-output data/equipment-sprites \
            --commit "$GAME_COMMIT" \
            --locale ru-RU

      - name: Validate equipment catalog
        run: |
          python3 scripts/validate_equipment_catalog.py \
            --catalog data/equipment-catalog.json \
            --index data/equipment-index.json \
            --config config/equipment-sources.yml \
            --sprites data/equipment-sprites

      - name: Save equipment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/equipment-index.json \
            data/equipment-catalog.json \
            data/equipment-sprites

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build equipment catalog"
            git push
          fi
