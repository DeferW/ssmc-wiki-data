name: Build mobs data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-generated-data
  cancel-in-progress: false

jobs:
  build-mobs:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download mob sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          sparse-checkout: |
            Resources/Prototypes
            Resources/Locale/ru-RU
            Resources/Textures
          sparse-checkout-cone-mode: false

      - name: Install catalog tools
        run: |
          python3 -m pip install -r requirements.txt

      - name: Build mob data
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 -m scripts.mobs.build \
            --game-source game-source \
            --output data/mobs/catalog.json \
            --sprites-output data/mobs/sprites \
            --commit "$GAME_COMMIT" \
            --locale ru-RU

      - name: Validate mob catalog
        run: |
          python3 -m scripts.mobs.validate \
            --catalog data/mobs/catalog.json \
            --sprites data/mobs/sprites

      - name: Save mob data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mobs/catalog.json data/mobs/sprites

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build mob catalog"
            git push
          fi
