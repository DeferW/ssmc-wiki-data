name: Build chemistry catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-chemistry-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Download chemistry sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          sparse-checkout: |
            Resources/ServerInfo/Guidebook/_RMC14/Chemicals/OT.xml
            Resources/ServerInfo/Guidebook/_RMC14/Chemicals/Medicine.xml
            Resources/ServerInfo/Guidebook/_RMC14/Chemicals/RMCChemicals.xml
            Resources/ServerInfo/Guidebook/_RMC14/Guides/RMCGuideDrinks.xml
            Resources/Prototypes/_RMC14/Reagents
            Resources/Prototypes/_Stories/Reagents
            Resources/Prototypes/_RMC14/Recipes/Reactions
            Resources/Prototypes/_Stories/Recipes/Reactions
            Resources/Prototypes/Reagents
            Resources/Locale/ru-RU
          sparse-checkout-cone-mode: false

      - name: Install YAML parser
        run: |
          python3 -m pip install "PyYAML>=6,<7"

      - name: Build chemistry data
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 scripts/extract_guide_sections.py \
            --game-source game-source \
            --output data/chemistry-guides.json \
            --commit "$GAME_COMMIT"

          python3 scripts/index_chemistry.py \
            --game-source game-source \
            --output data/chemistry-index.json \
            --commit "$GAME_COMMIT"

          python3 scripts/build_chemistry_catalog.py \
            --index data/chemistry-index.json \
            --guides data/chemistry-guides.json \
            --game-source game-source \
            --output data/chemistry-catalog.json \
            --locale ru-RU

      - name: Validate chemistry catalog
        run: |
          python3 scripts/validate_chemistry_catalog.py \
            --catalog data/chemistry-catalog.json

      - name: Save chemistry data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/chemistry-guides.json \
            data/chemistry-index.json \
            data/chemistry-catalog.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build chemistry catalog"
            git push
          fi
