name: PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install ruff

      - name: Lint scripts
        run: ruff check scripts/

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run tests
        run: python3 -m pytest scripts/

  validate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install catalog tools
        run: python3 -m pip install -r requirements.txt

      - name: Validate chemistry catalog
        run: |
          python3 -m scripts.chemistry.validate \
            --catalog data/chemistry/catalog.json

      - name: Validate catalog
        run: |
          python3 -m scripts.catalog.validate \
            --catalog data/catalog/catalog.json \
            --index data/catalog/index.json \
            --config config/catalog-sources.yml \
            --sprites data/catalog/sprites

      - name: Validate mob catalog
        run: |
          python3 -m scripts.mobs.validate \
            --catalog data/mobs/catalog.json
