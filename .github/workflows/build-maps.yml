name: Build map data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-generated-data
  cancel-in-progress: false

jobs:
  build-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Content.MapRenderer is part of the game and depends on the complete
      # content solution plus RobustToolbox. A sparse asset checkout cannot
      # reproduce entity visuals correctly.
      - name: Download the exact game renderer and sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          submodules: recursive

      - name: Set up game .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: game-source/global.json

      - name: Patch renderer metadata and layer alignment
        run: git -C game-source apply ../scripts/maps/renderer-world-bounds.patch

      - name: Install map builder tools
        run: python3 -m pip install -r requirements.txt

      - name: Discover active SSMC maps
        id: game-source
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)
          echo "GAME_COMMIT=$GAME_COMMIT" >> "$GITHUB_ENV"
          echo "commit=$GAME_COMMIT" >> "$GITHUB_OUTPUT"

          python3 -m scripts.maps.build \
            --game-source game-source \
            --render-list-output render-list.txt \
            --insert-render-list-output insert-render-list.txt \
            --discovery-only \
            --commit "$GAME_COMMIT"

      # Saved maps can contain stale runtime UI or device-link state. It is not
      # visual/map data and the headless renderer correctly rejects invalid
      # references. Keep the checkout untouched and sanitize every render copy.
      - name: Prepare temporary map copies for rendering
        run: |
          python3 -m scripts.maps.prepare_render \
            --render-list render-list.txt \
            --output render-input \
            --output-list prepared-render-list.txt

      - name: Prepare map insert copies for rendering
        run: |
          python3 -m scripts.maps.prepare_render \
            --render-list insert-render-list.txt \
            --output insert-render-input \
            --output-list prepared-insert-render-list.txt \
            --unique-names

      - name: Restore unchanged raw map renders
        id: rendered-map-cache
        uses: actions/cache/restore@v5
        with:
          path: rendered-maps
          key: raw-map-renders-v3-${{ runner.os }}-${{ steps.game-source.outputs.commit }}-${{ hashFiles('scripts/maps/prepare_render.py', 'scripts/maps/renderer-world-bounds.patch') }}
          restore-keys: |
            raw-map-renders-v3-${{ runner.os }}-${{ steps.game-source.outputs.commit }}-

      - name: Render maps with the game renderer
        if: steps.rendered-map-cache.outputs.cache-matched-key == ''
        working-directory: game-source
        run: |
          mapfile -t MAP_FILES < ../prepared-render-list.txt

          if ! dotnet run \
              --project Content.MapRenderer \
              --configuration Release \
              -- \
              --files \
              --viewer \
              --format webp \
              --output "$GITHUB_WORKSPACE/rendered-maps" \
              "${MAP_FILES[@]}"; then
            echo "::warning::Batch render failed; checking every map separately"
            FAILED_MAPS=()

            for MAP_FILE in "${MAP_FILES[@]}"; do
              if ! dotnet run \
                  --no-build \
                  --project Content.MapRenderer \
                  --configuration Release \
                  -- \
                  --files \
                  --viewer \
                  --format webp \
                  --output "$GITHUB_WORKSPACE/rendered-maps" \
                  "$MAP_FILE"; then
                FAILED_MAPS+=("$MAP_FILE")
              fi
            done

            if (( ${#FAILED_MAPS[@]} > 0 )); then
              printf '::error::Maps rejected by the game renderer: %s\n' "${FAILED_MAPS[*]}"
              exit 1
            fi
          fi

      # Save before packaging so a size/encoding failure does not force the
      # expensive game renderer to repeat unchanged work on the next run.
      - name: Save raw map renders
        if: steps.rendered-map-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rendered-maps
          key: raw-map-renders-v3-${{ runner.os }}-${{ steps.game-source.outputs.commit }}-${{ hashFiles('scripts/maps/prepare_render.py', 'scripts/maps/renderer-world-bounds.patch') }}

      - name: Restore unchanged raw map insert renders
        id: rendered-insert-cache
        uses: actions/cache/restore@v5
        with:
          path: rendered-inserts
          key: raw-map-insert-renders-v1-${{ runner.os }}-${{ steps.game-source.outputs.commit }}-${{ hashFiles('scripts/maps/prepare_render.py', 'scripts/maps/renderer-world-bounds.patch') }}

      - name: Render map inserts with the game renderer
        if: steps.rendered-insert-cache.outputs.cache-hit != 'true'
        working-directory: game-source
        run: |
          mapfile -t MAP_FILES < ../prepared-insert-render-list.txt
          DOTNET_BUILD_ARGS=()
          if [[ "${{ steps.rendered-map-cache.outputs.cache-matched-key }}" == "" ]]; then
            DOTNET_BUILD_ARGS+=(--no-build)
          fi

          if ! dotnet run \
              "${DOTNET_BUILD_ARGS[@]}" \
              --project Content.MapRenderer \
              --configuration Release \
              -- \
              --files \
              --viewer \
              --format webp \
              --output "$GITHUB_WORKSPACE/rendered-inserts" \
              "${MAP_FILES[@]}"; then
            echo "::warning::Batch insert render failed; checking every insert separately"
            FAILED_MAPS=()

            for MAP_FILE in "${MAP_FILES[@]}"; do
              if ! dotnet run \
                  --no-build \
                  --project Content.MapRenderer \
                  --configuration Release \
                  -- \
                  --files \
                  --viewer \
                  --format webp \
                  --output "$GITHUB_WORKSPACE/rendered-inserts" \
                  "$MAP_FILE"; then
                FAILED_MAPS+=("$MAP_FILE")
              fi
            done

            if (( ${#FAILED_MAPS[@]} > 0 )); then
              printf '::error::Map inserts rejected by the game renderer: %s\n' "${FAILED_MAPS[*]}"
              exit 1
            fi
          fi

      - name: Save raw map insert renders
        if: steps.rendered-insert-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: rendered-inserts
          key: raw-map-insert-renders-v1-${{ runner.os }}-${{ steps.game-source.outputs.commit }}-${{ hashFiles('scripts/maps/prepare_render.py', 'scripts/maps/renderer-world-bounds.patch') }}

      - name: Build compact overlays and lazy tile pyramids
        run: |
          python3 -m scripts.maps.build \
            --game-source game-source \
            --rendered-input rendered-maps \
            --rendered-inserts-input rendered-inserts \
            --output data/maps/catalog.json \
            --assets-output data/maps \
            --commit "$GAME_COMMIT" \
            --render-scale 1 \
            --tile-size 512 \
            --webp-quality 82 \
            --max-assets-bytes 536870912

      - name: Validate map data and size budget
        run: |
          python3 -m scripts.maps.validate \
            --catalog data/maps/catalog.json \
            --assets data/maps \
            --max-assets-bytes 536870912

      - name: Save map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/maps

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build map data"
            # A manual commit can land while the expensive renderer is running.
            # Replay generated data on the current branch tip instead of losing
            # the completed build to a non-fast-forward push rejection.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
