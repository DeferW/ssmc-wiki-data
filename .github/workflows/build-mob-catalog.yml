name: Build mob catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mob-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Download wiki data repository
        uses: actions/checkout@v7.0.1

      - name: Download mob sources
        uses: actions/checkout@v7.0.1
        with:
          repository: MetalSage/space-stories-cm14
          ref: master
          path: game-source
          sparse-checkout: |
            Resources/Prototypes
            Resources/Locale/ru-RU
          sparse-checkout-cone-mode: false

      - name: Install catalog tools
        run: |
          python3 -m pip install -r requirements.txt

      - name: Build mob data
        run: |
          GAME_COMMIT=$(git -C game-source rev-parse HEAD)

          python3 scripts/build_mob_catalog.py \
            --game-source game-source \
            --output data/mob-catalog.json \
            --commit "$GAME_COMMIT" \
            --locale ru-RU

      - name: Validate mob catalog
        run: |
          python3 scripts/validate_mob_catalog.py \
            --catalog data/mob-catalog.json

      - name: Save mob data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mob-catalog.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Build mob catalog"
            git push
          fi
