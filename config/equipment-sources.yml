schemaVersion: 3

# These equipment sources seed the catalog. The builder follows their current
# contents and technical dependencies instead of storing today's item list.
vendors:
  - id: ColMarTechCargoGuns
  - id: ColMarTechCargoAmmo
  - id: ColMarTechCargoAttachments
  - id: ColMarTechSurplus
  - id: ColMarTechGuns
  - id: ColMarTechMunitions
  - id: ColMarTechUtilities
  - id: ColMarTechSGGear
  - id: ColMarTechSWSGear
  - id: ColMarTechSLGear
  - id: ColMarTechFLGear
  - id: ColMarTechSCTGear
  - id: ColMarTechMedicalGear
  - id: ColMarTechSCTEquipment
  - id: ColMarTechMedicalEquipment
  - id: ColMarTechFLEquipment
  - id: ColMarTechSGEquipment
  - id: ColMarTechSWSEquipment
  - id: ColMarTechSLEquipment
  - id: ColMarTechCargoUniform
  - id: ColMarTechSeniorOfficerEquipment

# Pick up newly added marine vendors automatically. Explicit ids above remain
# useful as required sources: the validator will fail if one of them disappears.
vendorDiscoveryPrefixes:
  - ColMarTech

# Cargo consoles expose RequisitionsComputer categories. Their orderable crates
# seed the graph, but the shipping crates themselves never enter publicCatalog.
cargoCatalogs:
  - id: CMASRSConsole

# Everything reachable from the configured/discovered sources is published.
# Manual cleanup belongs to the admin override layer; the automatic builder
# only classifies items and unwraps transport-only packaging.
classification:
  excludePrototypeIds: []
  categoryOverrides: {}
  canonicalPrototypeIds: {}
